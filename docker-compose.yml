# Bongalink: MySQL + Node API + Python ML worker + static frontend.
#
#   1. Create a .env file next to this one (git-ignored):
#        DB_PASSWORD=choose-a-password
#        JWT_SECRET=choose-a-long-random-string
#   2. docker compose up --build
#   3. Frontend: http://localhost:5500/Pages/Homepage/homepage.html   API: http://localhost:4000/api/health
#
# Demo data instead of an empty store (see ml/worker/README.md):
#   docker compose run --rm worker python seed_demo.py
#   DB_NAME=bongalink_test docker compose up -d api worker
#
# A fresh volume is initialised from the schema dump + migration 003. For an existing
# database, apply Backend/database/migrations/003_ml_sync.sql yourself instead.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_DATABASE: bongalink
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Backend/database/bongalink_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Backend/database/migrations/003_ml_sync.sql:/docker-entrypoint-initdb.d/03_ml_sync.sql:ro
    ports:
      - "3307:3306"            # 3307 on the host so it doesn't clash with a local MySQL
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./Backend
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5500,http://127.0.0.1:5500
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-bongalink}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 7d
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ml/worker/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-bongalink}
      ML_TRAINER: tensorflow
    volumes:
      - ml-models:/repo/ml/worker/models     # versioned model files survive rebuilds
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
    ports:
      - "5500:80"

volumes:
  mysql-data:
  uploads:
  ml-models:
