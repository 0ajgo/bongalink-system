<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Bongalink</title>
<link rel="stylesheet" href="../../CSS/design-system.css">
<link rel="stylesheet" href="../../CSS/chat.css">
<link rel="stylesheet" href="../../CSS/product.css">
</head>
<body class="app">
<header id="site-header"></header>

<main id="main" class="container page">
  <div class="product-topbar">
    <nav aria-label="Breadcrumb"><ol class="breadcrumb" id="breadcrumb">
      <li><a href="homepage.html">Home</a></li>
    </ol></nav>
    <a class="btn btn--ghost btn--sm" href="homepage.html#catalog"><i data-icon="store" data-size="16"></i> Back to shop</a>
  </div>

  <div id="productView" aria-live="polite" aria-busy="true"></div>

  <section class="section related" id="relatedSection" aria-labelledby="relatedTitle" hidden>
    <div class="section-head"><h2 id="relatedTitle">More in this category</h2></div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span>Bongalink — computer, laptop and printer parts since 2008.</span>
    <span>GCash and bank transfer · J&amp;T, LBC and Lalamove delivery</span>
  </div>
</footer>

<!-- Full-screen photo viewer -->
<dialog class="viewer" id="photoDialog" aria-labelledby="photoDialogTitle" aria-describedby="viewerHelp">
  <div class="viewer__bar">
    <h2 class="viewer__title" id="photoDialogTitle">Photos</h2>
    <span class="viewer__count" id="viewerCount" aria-live="polite"></span>
    <button class="viewer__close" type="button" data-close><i data-icon="x" data-label="Close"></i></button>
  </div>
  <div class="viewer__track" id="viewerTrack"></div>
  <button class="viewer__arrow viewer__arrow--prev" type="button" id="photoPrev"><i data-icon="chevron-right" data-label="Previous photo" class="flip"></i></button>
  <button class="viewer__arrow viewer__arrow--next" type="button" id="photoNext"><i data-icon="chevron-right" data-label="Next photo"></i></button>
  <p class="sr-only" id="viewerHelp">Tap a photo to zoom in or out. Swipe, or use the arrow keys, for the next photo. Escape closes.</p>
</dialog>

<script src="../../JS/config.js"></script>
<script src="../../JS/api.js"></script>
<script src="../../JS/icons.js"></script>
<script src="../../JS/cart.js"></script>
<script src="../../JS/ui.js"></script>
<script src="../../JS/chat.js"></script>
<script src="../../JS/product.js"></script>
</body>
</html>
