<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password — Bongalink</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../../CSS/design-system.css">
<link rel="stylesheet" href="../../CSS/auth.css">
</head>
<body class="app">
<header id="site-header"></header>

<!-- Accounts created by the shop: the emailed link opens this page
     (set-password.html?token=...). GET/POST /api/auth/set-password
     (js/set-password.js). Setting the password also verifies the email. -->
<div class="auth">
  <main class="auth__main" id="main">
    <div class="auth__card">
      <h1>Set your password</h1>
      <p class="auth__lead" id="setLead">Checking your link…</p>

      <div class="alert" id="setMessage" role="alert" hidden></div>

      <form id="setForm" novalidate hidden>
        <div class="field">
          <label class="label" for="setUsername">Username</label>
          <input class="input" id="setUsername" type="text" autocomplete="username" readonly>
        </div>
        <div class="field">
          <label class="label" for="newPassword">New password</label>
          <div class="password-field">
            <input class="input" id="newPassword" type="password" autocomplete="new-password" minlength="6" required aria-describedby="newPasswordHint newPasswordError">
            <button class="btn btn--ghost btn--sm" type="button" id="toggleNew" aria-controls="newPassword">Show</button>
          </div>
          <span class="hint" id="newPasswordHint">At least 6 characters.</span>
          <span class="error-text" id="newPasswordError" role="alert"></span>
        </div>
        <div class="field">
          <label class="label" for="confirmPassword">Type it again</label>
          <input class="input" id="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="confirmPasswordError">
          <span class="error-text" id="confirmPasswordError" role="alert"></span>
        </div>
        <button class="btn btn--primary btn--lg btn--block" type="submit" id="setSubmit">Set password</button>
      </form>

      <p class="auth__alt"><a href="login.html">Go to login</a></p>
    </div>
  </main>

  <aside class="auth__aside" aria-label="Why Bongalink">
    <h2>Welcome to Bongalink.</h2>
    <p>The shop created this account for you. Choose a password to finish setting it up; it also confirms your email address.</p>
  </aside>
</div>

<script src="../../JS/api.js"></script>
<script src="../../JS/icons.js"></script>
<script src="../../JS/cart.js"></script>
<script src="../../JS/ui.js"></script>
<script src="../../JS/set-password.js"></script>
</body>
</html>
