<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My orders — Bongalink</title>
<link rel="stylesheet" href="../../CSS/design-system.css">
<link rel="stylesheet" href="../../CSS/chat.css">
<link rel="stylesheet" href="../../CSS/shop.css">
</head>
<body class="app">
<header id="site-header"></header>

<!-- js/orders.js fills #orders from GET /api/orders, and the tracking
     timeline of every shipped order from GET /api/v1/orders/:id/tracking (REQ014). -->
<main id="main" class="container page">
  <div class="page-head">
    <div>
      <h1>My orders</h1>
      <p>Payment status and delivery tracking for every order you've placed.</p>
    </div>
  </div>
  <div class="alert alert--error" id="orders-error" role="alert" hidden></div>
  <div class="order-list" id="orders" aria-live="polite"></div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span>Bongalink — computer, laptop and printer parts since 2008.</span>
    <span>Questions about a delivery? Reply to your shipping email.</span>
  </div>
</footer>

<script src="../../JS/config.js"></script>
<script src="../../JS/api.js"></script>
<script src="../../JS/icons.js"></script>
<script src="../../JS/cart.js"></script>
<script src="../../JS/ui.js"></script>
<script src="../../JS/chat.js"></script>
<script src="../../JS/orders.js"></script>
</body>
</html>
