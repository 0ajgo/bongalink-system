<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My orders — Bongalink</title>
<link rel="stylesheet" href="../../CSS/design-system.css">
<link rel="stylesheet" href="../../CSS/chat.css">

</head>
<body class="app">
<header id="site-header"></header>

<main id="main" class="container container--narrow page">
  <div class="page-head">
    <div>
      <h1>My orders</h1>
      <p>Press “Track” on an order to see where it is.</p>
    </div>
  </div>
  <div class="alert alert--error" id="orders-error" role="alert" hidden></div>
  <div class="order-list" id="orders" aria-live="polite"></div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span>Bongalink — computer, laptop and printer parts since 2008.</span>
    <span>Questions about a delivery? Reply to your shipping email.</span>
  </div>
</footer>
