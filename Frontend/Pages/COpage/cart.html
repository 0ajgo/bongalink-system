<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart — Bongalink</title>
<link rel="stylesheet" href="../../CSS/design-system.css">
<link rel="stylesheet" href="../../CSS/chat.css">
<link rel="stylesheet" href="../../CSS/shop.css">
</head>
<body class="app">
<header id="site-header"></header>

<!-- The cart lives on the server (/api/cart), the same cart POST /api/orders
     turns into an order. js/cart-page.js renders it and changes it through
     cartApi (js/cart.js). -->
<main id="main" class="container page">
  <div class="page-head">
    <div>
      <h1>Your cart</h1>
      <p>Check quantities before checkout. Stock is confirmed again when you place the order.</p>
    </div>
    <a class="btn btn--ghost" href="../Homepage/homepage.html"><i data-icon="store" data-size="18"></i> Keep shopping</a>
  </div>
  <div id="cart-body" aria-live="polite"></div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span>Bongalink — computer, laptop and printer parts and repair since 2008.</span>
    <span>GCash and bank transfer · J&amp;T, LBC and Lalamove delivery</span>
  </div>
</footer>

<script src="../../JS/api.js"></script>
<script src="../../JS/icons.js"></script>
<script src="../../JS/cart.js"></script>
<script src="../../JS/ui.js"></script>
<script src="../../JS/chat.js"></script>
<script src="../../JS/cart-page.js"></script>
</body>
</html>
