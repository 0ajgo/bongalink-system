<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop parts — Bongalink</title>
<link rel="stylesheet" href="../../CSS/design-system.css">
<link rel="stylesheet" href="../../CSS/catalog.css">
</head>
<body class="app">
<a class="skip-link btn btn--primary" href="#main">Skip to products</a>

<!-- PHASE 1 DESIGN PREVIEW — the product listing restyled with
     CSS/design-system.css. Reads the real catalog from GET /api/products.
     Becomes the homepage catalog in Phase 2; delete this folder then. -->
<header id="site-header"></header>

<main id="main" class="page">
  <div class="container">
    <div class="page-head">
      <div>
        <h1>Shop parts</h1>
        <p>Printer, laptop and desktop parts, checked and shipped nationwide.</p>
      </div>
    </div>

    <div class="layout-sidebar">
      <aside class="hide-mobile" aria-label="Categories">
        <p class="eyebrow catalog-aside__title">Categories</p>
        <ul class="filter-list" id="category-list"></ul>
      </aside>

      <section aria-labelledby="results-title">
        <div class="chips show-mobile" id="category-chips" aria-label="Categories"></div>
        <div class="catalog-toolbar">
          <h2 id="results-title" class="catalog-toolbar__title">All parts <span class="muted" id="result-count"></span></h2>
          <div class="row">
            <label class="check" for="in-stock-only"><input type="checkbox" id="in-stock-only"> In stock only</label>
            <label class="sr-only" for="sort">Sort by</label>
            <select class="select catalog-toolbar__sort" id="sort">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="product-grid" aria-live="polite" aria-busy="true"></div>
      </section>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span>Bongalink — computer, laptop and printer parts since 2008.</span>
    <span>GCash and bank transfer · J&amp;T, LBC and Lalamove delivery</span>
  </div>
</footer>

<script src="../../JS/api.js"></script>
<script src="../../JS/icons.js"></script>
<script src="../../JS/ui.js"></script>
<script src="../../JS/catalog-preview.js"></script>
</body>
</html>
