# Exact versions for the worker's Docker image: the set installed in ml/worker/.venv and checked
# with pip-audit on 2026-10-20 (no known vulnerabilities). The Dockerfile installs
# requirements.txt with this file as constraints (pip install -r requirements.txt -c requirements.lock),
# so every package listed here gets exactly this version; anything Linux needs beyond it still resolves.
# The image installs tensorflow-cpu (same API, no CUDA) instead of tensorflow, at the same version.
# To upgrade: change the venv, run the tests and pip-audit, then regenerate this list from
#   .venv\Scripts\python -m pip freeze   (leave out pip; keep the tensorflow-cpu line in step).
